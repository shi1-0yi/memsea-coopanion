    topics.forEach((topic, index) => {
      // 斐波那契球面：簇与簇之间在三维里均匀铺开
      const y = total === 1 ? 0 : 1 - (index / (total - 1)) * 2;
      const ring = Math.sqrt(Math.max(0, 1 - y * y));
      const phi = index * Math.PI * (3 - Math.sqrt(5)) + rand(topic) * 0.6;
      const radius = 230 + rand(topic + 'r') * 190;
      centers.set(topic, {
        x: Math.cos(phi) * ring * radius,
        y: y * radius * 0.82,
        z: Math.sin(phi) * ring * radius,
      });
    });
    list.forEach((point) => {
      const cluster = clusterOf(point);
      const center = centers.get(cluster) || { x: 0, y: 0, z: 0 };
      const a = rand(point.id + 'a') * Math.PI * 2;
      const b = Math.acos(2 * rand(point.id + 'b') - 1);
      const rr = 16 + Math.pow(rand(point.id + 'r'), 0.65) * 120;
      point.x = center.x + Math.sin(b) * Math.cos(a) * rr;
      point.y = center.y + Math.cos(b) * rr * 0.72;
      point.z = center.z + Math.sin(b) * Math.sin(a) * rr;
      point.phase = rand(point.id + 'p') * Math.PI * 2;
      point.radius = 1.1 + Math.min(2.4, point.weight * 0.55);
    });
  }

  function ingest(data) {
    scene = data;
    points = (data.points || []).map((p) => ({ ...p }));
    layout(points);
    focus = new Set(data.focusIds || []);
    const byId = new Map(points.map((p) => [p.id, p]));
    edges = (data.edges || []).filter((e) => byId.has(e.a) && byId.has(e.b));
    const s = data.stats || {};
    const span = s.span ? Math.max(1, Math.round((s.span.to - s.span.from) / 86400000)) : 0;
    elStats.innerHTML = [
      `点 <b>${s.total || 0}</b>`, `线 <b>${s.edges || edges.length}</b>`,
      `跨度 <b>${span}</b> 天`, `焦点 <b>${s.focusCount || 0}</b>`,
    ].join('<span style="color:#2a3245"> | </span>');
  }

  async function load(rebuild) {
    try {
      const data = window.__SCENE__ ?? (await (await fetch('/api/scene')).json());
      if (window.__SCENE__ && rebuild) { ingest(window.__SCENE__); return; }
      if (!data.ok) throw new Error(data.error || '接口返回失败');
      ingest(data);
      lastFetch = Date.now();
      elError.style.display = 'none';
    } catch (error) {
      elError.textContent = `读不到场景：${error.message}（请确认服务已在运行）`;
      elError.style.display = 'grid';
    }
  }

  function visiblePoints() {
    if (onlyFocus && focus.size) return points.filter((p) => focus.has(p.id) || true);
    return points;
  }

  // 三维投影：先绕 Y 轴转（yaw）、再绕 X 轴转（pitch），最后透视除法。
  function project(point, t) {
    const drift = onlyFocus ? 0 : 1;
    const wx = point.x + cam.panX + Math.sin(t / 3200 + point.phase) * 7 * drift;
    const wy = point.y + cam.panY + Math.cos(t / 4100 + point.phase) * 5 * drift;
    const wz = point.z + Math.sin(t / 2700 + point.phase * 1.3) * 7 * drift;
    const cy = Math.cos(cam.yaw);
    const sy = Math.sin(cam.yaw);
    const cp = Math.cos(cam.pitch);
    const sp = Math.sin(cam.pitch);
    const x1 = wx * cy - wz * sy;
    const z1 = wx * sy + wz * cy;
    const y1 = wy * cp - z1 * sp;
    const z2 = wy * sp + z1 * cp;
    const depth = cam.dist + z2;
    const f = FOCAL / Math.max(140, depth);
    return {
      x: innerWidth / 2 + x1 * f,
      y: innerHeight / 2 + y1 * f,
      f,
      depth,
    };
  }

  function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    // 背景星尘
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 140; i += 1) {
      const x = (hash('bg' + i) % 1000) / 1000 * innerWidth;
      const y = (hash('bgy' + i) % 1000) / 1000 * innerHeight;
      const a = 0.05 + ((Math.sin(t / 2600 + i) + 1) / 2) * 0.12;
      ctx.fillStyle = `rgba(150,180,255,${a})`;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.restore();

    const list = visiblePoints();
    const pos = new Map();
    for (const point of list) pos.set(point.id, project(point, t));
    lastPos = pos;

    // 远 → 近 排序，后画的压住先画的，才有纵深遮挡感
    const order = list.slice().sort((a, b) => pos.get(b.id).depth - pos.get(a.id).depth);
    const idx = new Set(list.map((p) => p.id));

    // 线
    ctx.lineWidth = 1;
    for (const edge of edges) {
      if (!idx.has(edge.a) || !idx.has(edge.b)) continue;
      if (onlyFocus && !(focus.has(edge.a) && focus.has(edge.b))) continue;
      const a = pos.get(edge.a);
      const b = pos.get(edge.b);
      const near = (a.f + b.f) * 0.5;
      const alpha = Math.min(0.5, (0.03 + edge.score * 0.18) * near * 1.7);
      ctx.strokeStyle = edge.kind === 'topic'
        ? `rgba(120,170,255,${alpha})`
        : `rgba(180,200,230,${alpha * 0.8})`;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    // 簇名：每个 cluster 取成员投影重心打一个淡标签
    const groups = new Map();
    for (const point of list) {
      const key = point.cluster || point.topic || 'misc';
      const p = pos.get(point.id);
      const acc = groups.get(key) || { x: 0, y: 0, n: 0, near: 0 };
      acc.x += p.x; acc.y += p.y; acc.n += 1; acc.near = Math.max(acc.near, p.f);
      groups.set(key, acc);
    }
    ctx.font = '600 13px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    for (const [key, acc] of groups) {
      if (acc.n < 6) continue;
      ctx.globalAlpha = (onlyFocus ? 0.12 : 0.5) * Math.min(1, acc.near * 1.5);
      ctx.fillStyle = '#a9c0e6';
      ctx.fillText(`${key} ${acc.n}`, acc.x / acc.n, acc.y / acc.n);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    // 点：远小近大、远淡近亮
    for (const point of order) {
      const p = pos.get(point.id);
      const isFocus = focus.has(point.id);
      const isSel = selected === point.id;
      const isHover = hovered === point.id;
      const [r, g, b] = point.diary ? DIARY_COLOR : (KIND_COLOR[point.kind] || KIND_COLOR.event);
      const dim = onlyFocus && !isFocus;
      const base = Math.max(0.8, point.radius * (isFocus ? 1.9 : 1) * p.f * 1.75);
      // 遗忘：权重越低越淡，弱的记忆连亮度一起退（上游只按远近定透明度，这里补一层）
      const fade = Math.min(1, 0.35 + (Number(point.weight) || 1) * 0.25);
      ctx.globalAlpha = dim ? 0.1 : Math.min(1, (0.22 + p.f * 1.05) * fade);

      if (isFocus || isHover || isSel) {
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, base * 7);
        glow.addColorStop(0, `rgba(${r},${g},${b},${isSel ? 0.55 : 0.35})`);
        glow.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(p.x, p.y, base * 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(${r},${g},${b},${0.5 + 0.3 * Math.sin(t / 600)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, base * 3.2, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = `rgba(${r},${g},${b},${isFocus ? 1 : 0.85})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.8, base), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 每个点旁边标一句它是什么
    drawPointLabels(list, pos, t);

    // 悬停文字
    if (hovered) {
      const point = list.find((p) => p.id === hovered);
      if (point) {
        const p = pos.get(point.id);
        const label = point.text.length > 24 ? point.text.slice(0, 24) + '…' : point.text;
        ctx.font = '12px "Microsoft YaHei", sans-serif';
        const width = ctx.measureText(label).width + 14;
        ctx.fillStyle = 'rgba(8,11,20,.88)';
        ctx.strokeStyle = 'rgba(120,160,255,.28)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(p.x + 10, p.y - 22, width, 22, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#dfe8ff';
        ctx.fillText(label, p.x + 17, p.y - 7);
      }
    }

    if (Date.now() - lastFetch > 60000) load(false);
    requestAnimationFrame(frame);
  }

  // 每个点旁边标一句它是什么：按权重挑、按屏幕格子避让，缩放越大标得越多。
  function drawPointLabels(list, pos, t) {
    if (!showLabels) return;
    const budget = Math.max(24, Math.min(280, Math.round(72 * (CAM_DEFAULT.dist / cam.dist))));
    const rank = (p) => (focus.has(p.id) ? 4 : 0) + (p.id === selected ? 4 : 0) + (p.id === hovered ? 4 : 0) + (Number(p.weight) || 0);
    const candidates = list
      .filter((point) => {
        if (!point.text || point.text.length < 2) return false;
        const p = pos.get(point.id);
        if (!p || p.f < 0.55) return false;   // 太远的点不标，留给近景
        if (onlyFocus && focus.size) return focus.has(point.id) || point.id === hovered || point.id === selected;
        return true;
      })
      .sort((a, b) => rank(b) - rank(a))
      .slice(0, budget);

    const occupied = new Set();
    ctx.font = '11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    for (const point of candidates) {
      const p = pos.get(point.id);
      if (!p) continue;
      const label = point.text.length > 14 ? `${point.text.slice(0, 14)}…` : point.text;
      const w = ctx.measureText(label).width;
      const x = Math.round(p.x + 7);
      const y = Math.round(p.y - 5);
      if (x + w > innerWidth - 4 || x < -2) continue;
      const cell = `${Math.floor(x / 104)}:${Math.floor(y / 14)}`;
      if (occupied.has(cell)) continue;
      occupied.add(cell);
      const hot = point.id === hovered || point.id === selected || focus.has(point.id);
      ctx.globalAlpha = hot ? 0.95 : 0.42;
      ctx.fillStyle = hot ? '#e6efff' : '#93a3c4';
      ctx.fillText(label, x, y);
      if (hot) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#78aaff';
        ctx.fillRect(x - 3, y - 9, 1.2, 11);
      }
    }
    ctx.globalAlpha = 1;
  }

  function pick(mx, my) {
    const now = performance.now();
    let best = null;
    let bestDist = 16;
    for (const point of points) {
      const p = lastPos.get(point.id) || project(point, now);
      const dist = Math.hypot(p.x - mx, p.y - my);
      if (dist < bestDist) { bestDist = dist; best = point; }
    }
    return best;
  }

  function showDetail(point) {
    if (!point) { detail.classList.remove('on'); return; }
    detail.classList.add('on');
    document.getElementById('dKind').textContent = point.diary ? `她的日记 · ${point.diary.date}` : (KIND_LABEL[point.kind] || point.kind);
    document.getElementById('dText').textContent = point.full || point.text;
    const when = new Date(point.t);
    document.getElementById('dTime').textContent = `${when.getMonth() + 1}/${when.getDate()} ${String(when.getHours()).padStart(2, '0')}:${String(when.getMinutes()).padStart(2, '0')}`;
    document.getElementById('dTopic').textContent = `主题 ${point.cluster || point.topic}`;
    document.getElementById('dSource').textContent = point.source?.type === 'diary' ? '来自她自己写的日记' : (point.source?.type === 'longterm' ? '来自长期记忆' : '来自真实消息');
    document.getElementById('dTags').innerHTML = (point.keywords || []).map((k) => `<span>${k}</span>`).join('');
  }

  // 左键拖动 = 转整片海（三维），右键拖动 = 平移，滚轮 = 拉近拉远。
  window.addEventListener('mousedown', (event) => {
    if (event.button !== 0 && event.button !== 2) return;
    if (event.target.closest && event.target.closest('button, a, input, textarea')) return;
    event.preventDefault();
    dragging = {
      x: event.clientX,
      y: event.clientY,
      mode: event.button === 2 ? 'pan' : 'orbit',
      yaw: cam.yaw,
      pitch: cam.pitch,
      panX: cam.panX,
      panY: cam.panY,
    };
    dragMoved = false;
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('contextmenu', (event) => event.preventDefault());
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = null;
    canvas.style.cursor = 'grab';
  });
  window.addEventListener('mousemove', (event) => {
    if (dragging) {
      const dx = event.clientX - dragging.x;
      const dy = event.clientY - dragging.y;
      if (Math.hypot(dx, dy) > 4) dragMoved = true;
      if (dragging.mode === 'orbit') {
        cam.yaw = dragging.yaw + dx * 0.006;
        cam.pitch = Math.max(-1.35, Math.min(1.35, dragging.pitch - dy * 0.006));
      } else {
        const k = cam.dist / FOCAL;
        cam.panX = dragging.panX - dx * k;
        cam.panY = dragging.panY - dy * k;
      }
      return;
    }
    if (event.target !== canvas) { hovered = null; return; }
    const hit = pick(event.clientX, event.clientY);
    hovered = hit ? hit.id : null;
    canvas.style.cursor = hit ? 'pointer' : 'grab';
  });
  canvas.addEventListener('click', (event) => {
    if (dragMoved) { dragMoved = false; return; }
    const hit = pick(event.clientX, event.clientY);
    selected = hit ? hit.id : null;
    showDetail(hit);
  });
  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    const factor = event.deltaY > 0 ? 1.08 : 0.92;
    cam.dist = Math.min(3200, Math.max(380, cam.dist * factor));
  }, { passive: false });

  document.getElementById('btnFocus').addEventListener('click', (event) => {
    onlyFocus = !onlyFocus;
    event.currentTarget.classList.toggle('on', onlyFocus);
  });
  document.getElementById('btnLabels').addEventListener('click', (event) => {
    showLabels = !showLabels;
    event.currentTarget.classList.toggle('on', showLabels);
  });
  document.getElementById('btnRecent').addEventListener('click', (event) => {
    const on = !event.currentTarget.classList.contains('on');
    event.currentTarget.classList.toggle('on', on);
    if (on && points.length > 300) {
      points = points.slice(-300);
      layout(points);
      const ids = new Set(points.map((p) => p.id));
      edges = edges.filter((e) => ids.has(e.a) && ids.has(e.b));
    } else if (on === false) {
      load(false);
    }
  });
  document.getElementById('btnReset').addEventListener('click', () => { cam = { ...CAM_DEFAULT }; });

  window.addEventListener('resize', resize);
  resize();
  load(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
